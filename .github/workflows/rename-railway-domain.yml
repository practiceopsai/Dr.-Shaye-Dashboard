name: Rename Railway frontend domain

on:
  workflow_dispatch:

jobs:
  rename-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Rename frontend domain
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          railway domain update frontend-production-71f6.up.railway.app
          --domain eli-commandcenter
          --project 3f61b78e-9f6d-45c4-ad89-91ded7851330
          --environment production
          --service frontend
          --json
