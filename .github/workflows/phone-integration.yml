name: Verify native phone messaging

on:
  push:
    branches: [main]
    paths: ["integrations/hermes_phone/**", ".github/workflows/phone-integration.yml"]
  pull_request:
    paths: ["integrations/hermes_phone/**", ".github/workflows/phone-integration.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/hermes_phone/package-lock.json
      - name: Install presentation artifact writer
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: integrations/hermes_phone
      - name: Verify caller approval and delivery receipts
        run: python -m unittest discover -s integrations/hermes_phone -p "test_*.py" -v
