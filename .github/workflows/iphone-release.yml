name: Build iPhone for TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test && npm run release:check
      - name: Build and submit using configured EAS credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "Configure the EXPO_TOKEN repository secret first."; exit 1; }
          npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --wait --json > "$RUNNER_TEMP/eli-ios-build.json"
          BUILD_ID=$(node -e 'const builds = require(process.argv[1]); if (builds.length !== 1 || builds[0].status !== "FINISHED") process.exit(1); process.stdout.write(builds[0].id);' "$RUNNER_TEMP/eli-ios-build.json")
          npx --yes eas-cli@latest submit --platform ios --profile production --id "$BUILD_ID" --non-interactive --no-auto-testflight-setup
