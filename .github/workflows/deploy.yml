name: Deploy to Railway

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Test backend
        working-directory: backend
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q
      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
  deploy:
    needs: verify
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
          - service: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Configure backend browser origin
        if: matrix.service == 'backend'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          railway variable set
          ALLOWED_ORIGINS=https://eli-commandcenter.up.railway.app
          --skip-deploys
          --project 3f61b78e-9f6d-45c4-ad89-91ded7851330
          --environment production
          --service backend
      - name: Deploy service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          railway up --ci
          --project 3f61b78e-9f6d-45c4-ad89-91ded7851330
          --environment production
          --service ${{ matrix.service }}
          --message "GitHub $GITHUB_SHA"
